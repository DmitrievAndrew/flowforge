[project]
name = "flowforge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kafka-python>=2.0.3",
    "pyspark==4.2.0",
    "pymongo>=4.10.0",
    "clickhouse-connect>=0.8.17",
    "redis>=5.1.0",
    "feast>=0.64.0",
    "xgboost>=3.0.0",
    "lightgbm>=4.5.0",
    "scikit-learn>=1.6.0",
    "optuna>=4.0.0",
    "mlflow>=2.20.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "onnxruntime>=1.15.0",
]

[dependency-groups]
dev = [
    "torch>=2.6.0",
    "pytest>=8.0.0",
    "black",
    "ruff",
    "mypy",
    "ipython",
    "jupyter",
]